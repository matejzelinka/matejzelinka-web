name: Sync Notion → Build → Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: node scripts/notion-sync.mjs

      - name: Commit content changes
        run: |
          git config user.name "notion-bot"
          git config user.email "notion-bot@users.noreply.github.com"
          git add src/content/blog
          git diff --cached --quiet || git commit -m "Sync blog from Notion"
          git push

      - name: Build site
        run: npm run build

      - name: Deploy via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.matejzelinka.cz
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: sftp
          port: 222

          local-dir: dist/
          server-dir: ./

          dangerous-clean-slate: false
