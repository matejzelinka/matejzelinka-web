name: Sync Notion → Build → Deploy

on:
  workflow_dispatch:
  schedule:
  - cron: "0 5 * * *"

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: node scripts/notion-sync.mjs

      - name: Commit content changes
        run: |
          git config user.name "notion-bot"
          git config user.email "notion-bot@users.noreply.github.com"
          git add src/content/blog
          git diff --cached --quiet || git commit -m "Sync blog from Notion"
          git push

      - name: Build site
        run: npm run build

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@v7
        with:
          switches: -avz --delete=false
          path: dist/
          remote_path: ./
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_password: ${{ secrets.SSH_PASSWORD }}
